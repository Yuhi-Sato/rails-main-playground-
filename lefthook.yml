pre-commit:
  parallel: true
  commands:
    rubocop:
      glob: "*.{rb,rake}"
      run: bundle exec rubocop --force-exclusion {staged_files}
    brakeman:
      run: bundle exec brakeman --quiet --no-pager --force-scan

pre-push:
  commands:
    bundler-audit:
      run: bundle exec bundler-audit check --update
